title: Network Service Port Scanning (Nmap Reconnaissance)
id: c3d88192-351e-450f-bb72-01934ba5ef42
status: experimental
description: Detects TCP port scanning patterns commonly generated by Nmap (SYN scan, NULL scan, XMAS tree, FIN scan) probing for open network services.
references:
  - https://attack.mitre.org/techniques/T1046/
author: Mini-SOC Team
date: 2026/10/05
tags:
  - attack.discovery
  - attack.t1046
logsource:
  category: network_connection
  product: suricata
detection:
  selection:
    event_type: alert
    alert.signature_id:
      - 1000001
      - 1000002
      - 1000003
      - 1000004
      - 1000005
  timeframe: 10s
  condition: selection | count(dest_port) >= 5
falsepositives:
  - Internal vulnerability scanners (e.g., Nessus, Qualys, OpenVAS)
  - Network discovery tools during authorized inventory
level: high
